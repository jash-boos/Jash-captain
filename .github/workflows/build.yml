name: Build Captain APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Simple App
        run: |
          mkdir -p app/src/main/java/com/captain/autopickup
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          # Copy existing files if they are in root, otherwise create safe stubs
          echo 'apply plugin: "com.android.application"' > app/build.gradle
          echo 'android { namespace "com.captain.autopickup"; compileSdk 34; defaultConfig { applicationId "com.captain.autopickup"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }' >> app/build.gradle
          echo 'dependencies { implementation "androidx.appcompat:appcompat:1.6.1" }' >> app/build.gradle

          echo 'include ":app"' > settings.gradle
          echo 'rootProject.name = "CaptainAuto"' >> settings.gradle

          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.0"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0" } }' > build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Auto-APK
          path: app/build/outputs/apk/debug/app-debug.apk

